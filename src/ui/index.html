<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpecAutopsy Morgue</title>
  </head>
  <body>
    <svg class="defs" aria-hidden="true" focusable="false" width="0" height="0">
      <defs>
        <filter id="stamp-rough" x="-5%" y="-10%" width="110%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="1" seed="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="app"></div>
    <p id="link-status" data-link-status aria-live="polite"></p>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
